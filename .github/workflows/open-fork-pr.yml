name: Open Fork Pull Request

on:
  push:
    branches: ["review/upstream-audio-fixes"]

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    if: github.repository == 'wakmail/FineTune'
    runs-on: ubuntu-latest
    steps:
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: |
            This brings two focused audio fixes from the original FineTune repository into the fork.

            It prevents the soft start gate from cutting off short sounds after ordinary silence. It also contains corrupt nonfinite EQ samples within one audio buffer instead of allowing sustained distortion.

            The branch repairs the outdated output gate tests omitted by upstream pull request 388.

            Upstream sources: ronitsingh10/FineTune#388 and ronitsingh10/FineTune#408.

            Fork CI passes the full build and test suite.
        run: |
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$GITHUB_REF_NAME" \
            --title "Import focused upstream audio fixes" \
            --body "$PR_BODY"
